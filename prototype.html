<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>FishEye Cam</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { --safe-b: env(safe-area-inset-bottom, 20px); }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: -apple-system, 'SF Pro Display', 'PingFang SC', sans-serif; color: #fff; touch-action: none; }

  /* ===== Canvas empty state ===== */
  .canvas-empty { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: rgba(255,255,255,.3); cursor: pointer; transition: opacity .3s; z-index: 1; }
  .canvas-empty span { font-size: 15px; font-weight: 500; }
  .canvas-empty.hidden { opacity: 0; pointer-events: none; }

  /* ===== Editor (always visible) ===== */
  #editor { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 5; }

  /* Top bar */
  .top-bar { display: flex; align-items: center; height: 52px; padding: 0 8px; background: rgba(20,20,20,.95); flex-shrink: 0; padding-top: env(safe-area-inset-top, 0); }
  .top-bar > button { width: 44px; height: 44px; background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .top-bar .title { flex: 1; text-align: center; font-size: 17px; font-weight: 600; }
  .top-actions { display: flex; align-items: center; gap: 4px; }
  .top-action-btn { width: 36px; height: 36px; background: none; border: none; color: rgba(255,255,255,.7); cursor: pointer; display: flex; align-items: center; justify-content: center; border-radius: 8px; transition: background .15s, color .15s; }
  .top-action-btn:active { background: rgba(255,255,255,.1); color: #fff; }
  .top-save-btn { height: 32px; padding: 0 16px; border-radius: 16px; background: #fff; color: #000; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: transform .15s, opacity .15s; margin-left: 4px; }
  .top-save-btn:active { transform: scale(.95); opacity: .8; }

  /* Canvas area */
  .canvas-wrap { flex: 1; position: relative; background: #000; overflow: hidden; }
  #glCanvas { width: 100%; height: 100%; display: block; }

  /* Crosshair overlay */
  .crosshair { position: absolute; pointer-events: none; z-index: 2; transition: transform .05s linear; }
  .crosshair-ring { width: 32px; height: 32px; border: 2px solid rgba(255,255,255,.5); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); transition: border-color .15s, transform .15s; }
  .crosshair-dot { width: 6px; height: 6px; background: rgba(255,255,255,.7); border-radius: 50%; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); }
  .crosshair-line { position: absolute; background: rgba(255,255,255,.3); }
  .crosshair-line.v { width: 1px; height: 18px; left: 50%; transform: translateX(-50%); }
  .crosshair-line.v.top { bottom: calc(50% + 18px); }
  .crosshair-line.v.bot { top: calc(50% + 18px); }
  .crosshair-line.h { height: 1px; width: 18px; top: 50%; transform: translateY(-50%); }
  .crosshair-line.h.lft { right: calc(50% + 18px); }
  .crosshair-line.h.rgt { left: calc(50% + 18px); }
  .crosshair.active .crosshair-ring { border-color: rgba(255,255,255,.85); transform: translate(-50%,-50%) scale(1.25); }

  /* Radius ring */
  .radius-ring { position: absolute; border: 1.5px dashed rgba(255,255,255,.3); border-radius: 50%; pointer-events: none; z-index: 2; transform: translate(-50%,-50%); transition: border-color .15s, width .08s, height .08s; }
  .radius-ring.active { border-color: rgba(255,255,255,.6); }
  .radius-ring.hidden { display: none; }

  /* Bottom controls */
  .bottom-panel { background: rgba(20,20,20,.95); padding: 12px 20px 0; padding-bottom: calc(10px + var(--safe-b)); flex-shrink: 0; display: flex; flex-direction: column; }
  .bottom-controls { min-height: 104px; display: flex; flex-direction: column; justify-content: center; overflow: visible; }

  .slider-group { margin-bottom: 16px; }
  .slider-label { display: flex; justify-content: space-between; font-size: 12px; color: rgba(255,255,255,.5); margin-bottom: 8px; }
  .slider-label span:last-child { font-variant-numeric: tabular-nums; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: rgba(255,255,255,.15); border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; background: #fff; border-radius: 50%; cursor: pointer; box-shadow: 0 1px 4px rgba(0,0,0,.4); }

  /* Mode wheel selector */
  .mode-wheel-wrap { position: relative; height: 44px; margin-top: 4px; margin-bottom: 6px; overflow: hidden; perspective: 340px; }
  .mode-wheel { display: flex; gap: 0; height: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; will-change: transform; }
  .mode-item { flex-shrink: 0; display: flex; align-items: center; justify-content: center; height: 100%; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.3); white-space: nowrap; cursor: pointer; position: relative; transition: color .15s; transform-style: preserve-3d; }
  .mode-item.active { color: #fff; font-weight: 600; }
  /* Center indicator — subtle underline dot */
  .mode-wheel-indicator { position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%); width: 4px; height: 4px; border-radius: 50%; background: rgba(255,255,255,.5); pointer-events: none; z-index: 2; }

  /* Toast */
  .toast { position: fixed; bottom: 140px; left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(40,40,40,.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 10px 20px; border-radius: 100px; font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; opacity: 0; transition: opacity .3s, transform .3s; pointer-events: none; z-index: 100; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Hidden file input */
  #fileInput { display: none; }

  /* Frame color toggle */
  .frame-toggle { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .frame-label { font-size: 12px; color: rgba(255,255,255,.5); flex-shrink: 0; }
  .frame-btns { display: flex; gap: 8px; flex: 1; }
  .frame-btn { display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 8px; border: 1.5px solid rgba(255,255,255,.1); background: transparent; color: rgba(255,255,255,.45); font-size: 13px; font-weight: 500; cursor: pointer; transition: all .2s; }
  .frame-btn.active { border-color: rgba(255,255,255,.6); color: #fff; background: rgba(255,255,255,.1); }
  .frame-preview { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); }
  .frame-preview.dark { background: radial-gradient(circle, #333 40%, #0a0a0b 70%); }
  .frame-preview.light { background: radial-gradient(circle, #ccc 40%, #e0e0e2 70%); }
</style>
</head>
<body>

<!-- Editor (always visible, single page) -->
<div id="editor" class="visible">
  <div class="top-bar">
    <button onclick="pickImage()" aria-label="相册">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
    </button>
    <div class="title" id="modeTitle">放大镜</div>
    <div class="top-actions">
      <button class="top-action-btn" onclick="pickImage('camera')" aria-label="拍照">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
      </button>
      <button class="top-action-btn" onclick="removeBackgroundAI()" aria-label="去背景">
        <span style="font-size:12px;font-weight:700;line-height:1;">BG</span>
      </button>
      <button class="top-action-btn" onclick="resetParams()" aria-label="重置">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
      </button>
      <button class="top-action-btn" onclick="shareImage()" aria-label="分享">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      <button class="top-save-btn" onclick="saveImage()">保存</button>
    </div>
  </div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="glCanvas"></canvas>
    <!-- Empty state placeholder -->
    <div class="canvas-empty" id="canvasEmpty">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></svg>
      <span>点击选择照片</span>
    </div>
    <div class="crosshair" id="crosshair">
      <div class="crosshair-ring"></div>
      <div class="crosshair-dot"></div>
      <div class="crosshair-line v top"></div>
      <div class="crosshair-line v bot"></div>
      <div class="crosshair-line h lft"></div>
      <div class="crosshair-line h rgt"></div>
    </div>
    <div class="radius-ring" id="radiusRing"></div>
  </div>

  <div class="bottom-panel">
    <div class="bottom-controls" id="bottomControls">
      <div class="slider-group">
        <div class="slider-label"><span>强度</span><span id="strengthVal">80%</span></div>
        <input type="range" id="strengthSlider" min="0" max="150" value="80" oninput="onStrengthChange(this.value)">
      </div>
      <div class="slider-group" id="radiusGroup">
        <div class="slider-label"><span>半径</span><span id="radiusVal">42%</span></div>
        <input type="range" id="radiusSlider" min="5" max="60" value="42" oninput="onRadiusChange(this.value)">
      </div>

      <div class="frame-toggle" id="frameToggle">
        <div class="frame-btns">
          <button class="frame-btn active" data-fc="0" onclick="switchFrame(0)">
            <span class="frame-preview dark"></span>
          </button>
          <button class="frame-btn" data-fc="1" onclick="switchFrame(1)">
            <span class="frame-preview light"></span>
          </button>
        </div>
      </div>

      <div class="frame-toggle" id="folderColorToggle" style="display:none;">
        <div class="frame-label" style="font-size:12px;color:rgba(255,255,255,.5);margin-right:8px;">颜色</div>
        <div class="frame-btns" id="folderColorBtns" style="gap:6px;flex-wrap:wrap;"></div>
      </div>
    </div>

    <div class="mode-wheel-wrap" id="modeWheelWrap">
      <div class="mode-wheel-indicator"></div>
      <div class="mode-wheel" id="modeWheel">
        <div class="mode-item" data-mode="0">鱼眼</div>
        <div class="mode-item active" data-mode="1">放大镜</div>
        <div class="mode-item" data-mode="4">撕拉片</div>
        <div class="mode-item" data-mode="5">文件夹</div>
        <div class="mode-item" data-mode="2">马赛克</div>
        <div class="mode-item" data-mode="3">贴纸</div>
        <div class="mode-item" data-mode="6">Die-cut</div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileInput" accept="image/*">

<script>
// ============================================================
//  State
// ============================================================
const S = {
  mode: 1,           // 0=barrel, 1=bulge
  strength: 0.8,
  radius: 0.42,
  cx: 0.5, cy: 0.5,  // normalized center
  dragging: false,
  pinching: false,
  pinchStartRadius: 0,
  pinchStartDist: 0,
  imgLoaded: false,
  frameColor: 0,     // 0=black frame, 1=white frame
  // Peel-off film state (mode 4)
  peelX: 1.0, peelY: 1.0,  // peel corner position (normalized UV, reset to cardMax on mode enter)
  peelDragging: false,
  peelSpringActive: false,
  peelOpen: false,          // true = spring toward fully open, false = spring toward closed
  peelLocked: false,        // after one successful peel, ignore further peel gestures until mode reset
  peelVx: 0, peelVy: 0,
  peelTime: 0,
  peelCornerX: 1.0, peelCornerY: 1.0,  // which corner to peel from (card-local: 0 or 1 per axis)
  // Folder icon state (mode 5)
  folderColorIdx: 0,
  photoOffX: 0, photoOffY: 0,  // photo drag offset
  folderDragging: false,
  folderDragStartX: 0, folderDragStartY: 0,
  folderOffStartX: 0, folderOffStartY: 0,
};

let gl, program, posBuffer, texture, folderTexture, folderFrontTexture, peelTexture;
let uCenter, uRadius, uStrength, uMode, uResolution, uTexSize, uFrameColor, uPeelPos, uPeelCorner, uPeelClosed, uTime;
let uFolderColor, uFolderTabColor, uPhotoOffset, uFolderTex, uFolderFrontTex, uFolderTexSize, uPeelTex, uPeelTexSize;
let canvasWrap, canvas, crosshair, radiusRing;
let imgWidth = 1, imgHeight = 1;
let sourceImageCanvas = null;
let folderTexWidth = 1, folderTexHeight = 1;
let peelTexWidth = 2673, peelTexHeight = 5298;
let folderTexReady = false;
let folderFrontTexReady = false;
let rafId = null;

const PEEL_TEMPLATE = {
  width: 2673,
  height: 5298,
  scale: 0.86,
  photoMinX: 0.074,
  photoMinY: 0.064,
  photoMaxX: 0.926,
  photoMaxY: 0.712,
};

const FOLDER_COLORS = [
  { name: 'Snow',     body: [0.95, 0.94, 0.93], tab: [0.98, 0.97, 0.96] },
  { name: 'Blue',     body: [0.30, 0.56, 0.94], tab: [0.40, 0.64, 0.97] },
  { name: 'Purple',   body: [0.58, 0.36, 0.85], tab: [0.66, 0.45, 0.90] },
  { name: 'Pink',     body: [0.92, 0.42, 0.55], tab: [0.95, 0.52, 0.62] },
  { name: 'Orange',   body: [0.95, 0.60, 0.25], tab: [0.97, 0.68, 0.35] },
  { name: 'Yellow',   body: [0.95, 0.85, 0.30], tab: [0.97, 0.90, 0.42] },
  { name: 'Green',    body: [0.30, 0.78, 0.48], tab: [0.40, 0.84, 0.55] },
  { name: 'Graphite', body: [0.42, 0.42, 0.44], tab: [0.52, 0.52, 0.54] },
];

function getPeelPhotoRect() {
  const w = canvasWrap.clientWidth, h = canvasWrap.clientHeight;
  const screenAR = w / h;
  const peelAR = PEEL_TEMPLATE.width / PEEL_TEMPLATE.height;
  const halfH = PEEL_TEMPLATE.scale * 0.5;
  const halfW = halfH * peelAR / screenAR;
  const minX = 0.5 - halfW;
  const minY = 0.5 - halfH;
  const sizeX = halfW * 2.0;
  const sizeY = halfH * 2.0;
  return {
    minX: minX + sizeX * PEEL_TEMPLATE.photoMinX,
    minY: minY + sizeY * PEEL_TEMPLATE.photoMinY,
    maxX: minX + sizeX * PEEL_TEMPLATE.photoMaxX,
    maxY: minY + sizeY * PEEL_TEMPLATE.photoMaxY,
  };
}

// Returns the bottom-right corner of the peel photo window in UV [0,1] space
function getCardMax() {
  const r = getPeelPhotoRect();
  return { x: r.maxX, y: r.maxY };
}

// Returns the top-left corner of the peel photo window in UV [0,1] space
function getCardMin() {
  const r = getPeelPhotoRect();
  return { x: r.minX, y: r.minY };
}

// Returns screen UV position for a card corner given local coords (0 or 1 per axis)
function getCardCornerUV(localX, localY) {
  const cmin = getCardMin();
  const cmax = getCardMax();
  return {
    x: cmin.x + (cmax.x - cmin.x) * localX,
    y: cmin.y + (cmax.y - cmin.y) * localY
  };
}

// Find the closest card corner to a given screen UV point. Returns { localX, localY, screenX, screenY, dist }
function findClosestCorner(px, py) {
  const corners = [
    { lx: 0, ly: 0 }, // top-left
    { lx: 1, ly: 0 }, // top-right
    { lx: 0, ly: 1 }, // bottom-left
    { lx: 1, ly: 1 }, // bottom-right
  ];
  let best = null;
  for (const c of corners) {
    const uv = getCardCornerUV(c.lx, c.ly);
    const dx = px - uv.x, dy = py - uv.y;
    const d = Math.sqrt(dx * dx + dy * dy);
    if (!best || d < best.dist) {
      best = { localX: c.lx, localY: c.ly, screenX: uv.x, screenY: uv.y, dist: d };
    }
  }
  return best;
}

function getFolderRectPx() {
  const rect = canvasWrap.getBoundingClientRect();
  const folderAR = 1004 / 854;
  const folderScale = 0.50;
  const pxH = rect.height * folderScale;
  const pxW = pxH * folderAR;
  return {
    x: rect.left + (rect.width - pxW) * 0.5,
    y: rect.top + (rect.height - pxH) * 0.5,
    w: pxW,
    h: pxH,
  };
}

function isPointInFolder(clientX, clientY) {
  const r = getFolderRectPx();
  return clientX >= r.x && clientX <= r.x + r.w && clientY >= r.y && clientY <= r.y + r.h;
}

function resetPeelCover() {
  S.peelCornerX = 1.0;
  S.peelCornerY = 1.0;
  const cornerUV = getCardCornerUV(S.peelCornerX, S.peelCornerY);
  S.peelX = cornerUV.x;
  S.peelY = cornerUV.y;
  S.peelVx = 0;
  S.peelVy = 0;
  S.peelSpringActive = false;
  S.peelDragging = false;
  S.peelOpen = false;
  S.peelLocked = false;
}

// ============================================================
//  WebGL Setup
// ============================================================
const VERT = `
  attribute vec2 a_pos;
  varying vec2 v_uv;
  void main() {
    v_uv = a_pos * 0.5 + 0.5;
    v_uv.y = 1.0 - v_uv.y;
    gl_Position = vec4(a_pos, 0, 1);
  }
`;

const FRAG = `
  precision highp float;
  varying vec2 v_uv;
  uniform sampler2D u_tex;
  uniform vec2  u_center;
  uniform float u_radius;
  uniform float u_strength;
  uniform float u_mode;
  uniform vec2  u_resolution;
  uniform vec2  u_texSize;
  uniform float u_frameColor; // 0=black, 1=white
  uniform vec2  u_peelPos;    // peel corner (normalized 0-1)
  uniform vec2  u_peelCorner; // which corner is being peeled (card-local: 0/1 for each axis)
  uniform float u_peelClosed;  // force fully closed cover when idle
  uniform float u_time;
  uniform sampler2D u_peelTex;       // peel-off film template texture
  uniform vec2  u_peelTexSize;       // peel template texture dimensions
  uniform sampler2D u_folderTex;      // folder BACK layer texture
  uniform sampler2D u_folderFrontTex; // folder FRONT layer texture (overlays on photo)
  uniform vec2  u_folderTexSize;  // folder texture dimensions
  uniform vec3  u_folderColor;    // folder body color
  uniform vec3  u_folderTabColor; // folder tab color
  uniform vec2  u_photoOffset;    // photo drag offset in folder mode

  // ---- Mode A: Barrel Distortion ----
  vec2 barrelDistort(vec2 uv, vec2 center, float strength, float aspect) {
    vec2 d = uv - center;
    d.x *= aspect;
    float r = length(d);
    float rNorm = r * 2.0;
    float r2 = rNorm * rNorm;
    float r4 = r2 * r2;
    float k1 = strength * 1.082;
    float k2 = strength * strength * 0.406;
    float scale = 1.0 + k1 * r2 + k2 * r4;
    d /= scale;
    d.x /= aspect;
    return center + d;
  }

  // ---- Mode B: Local Bulge / Magnifier ----
  vec2 bulgeDistort(vec2 uv, vec2 center, float radius, float strength, float aspect) {
    vec2 d = uv - center;
    d.x *= aspect;
    float dist = length(d);
    if (dist >= radius) return uv;
    float nd = dist / radius;
    float bulge = pow(1.0 - nd, 2.0) * strength;
    float newDist = dist * (1.0 - bulge);
    vec2 dir = dist > 0.001 ? normalize(d) : vec2(0.0);
    vec2 nd2 = dir * newDist;
    nd2.x /= aspect;
    return center + nd2;
  }

  // ---- Lens frame: circular mask with solid color surround ----
  vec4 renderFrame(vec2 uv, vec2 center, float radius, float aspect, float fc) {
    vec2 d = uv - center;
    d.x *= aspect;
    float r = length(d);
    vec3 surroundColor = mix(vec3(0.0), vec3(1.0), fc);
    float imgMask = 1.0 - smoothstep(radius - 0.012, radius + 0.003, r);
    return vec4(surroundColor, imgMask);
  }

  float hash21(vec2 p) {
    p = fract(p * vec2(123.34, 456.21));
    p += dot(p, p + 45.32);
    return fract(p.x * p.y);
  }

  vec3 applyPeelPhotoLook(vec3 col, vec2 uv) {
    // Approximation of: 净白+36, kv88+30, 理光+18, 珠光蓝+18,
    // 柔光17/15, 暗角47, 划痕II 27, 诺基亚 噪点3 强度9 滤镜21 发光4.
    col = pow(col, vec3(0.88));                 // 净白: brighten mids
    col = mix(col, vec3(dot(col, vec3(0.299, 0.587, 0.114))), -0.08);

    // KV88 warm film tone.
    col *= vec3(1.045, 1.015, 0.965);
    col = mix(col, col * col * (3.0 - 2.0 * col), 0.10);

    // Ricoh-style contrast and slight green shift.
    col = (col - 0.5) * 1.09 + 0.5;
    col.g += 0.012;
    col.b -= 0.006;

    // Pearl blue: cool shadows, keep highlights creamy.
    float lum = dot(col, vec3(0.299, 0.587, 0.114));
    vec3 bluePearl = vec3(0.90, 0.96, 1.08);
    col = mix(col * bluePearl, col, smoothstep(0.25, 0.85, lum) * 0.75 + 0.25);

    // Soft light / glow.
    vec3 soft = 1.0 - (1.0 - col) * (1.0 - col);
    col = mix(col, soft, 0.15 * 0.17);
    col += vec3(0.04) * 0.04 * smoothstep(0.45, 1.0, lum);

    // Nokia-ish mild poster tone + grain.
    float n = hash21(uv * u_texSize.xy + u_time * 8.0) - 0.5;
    col += vec3(n) * 0.018;
    col = mix(col, floor(col * 24.0) / 24.0, 0.035);

    // Vignette.
    float d = length((uv - 0.5) * vec2(0.82, 1.0));
    float vig = 1.0 - smoothstep(0.35, 0.82, d) * 0.47;
    col *= vig;

    // Scratches II: sparse vertical pale scratches.
    float stripe = step(0.986, hash21(vec2(floor(uv.x * 90.0), 7.1)));
    float scratchShape = smoothstep(0.35, 0.95, hash21(vec2(floor(uv.x * 90.0), floor(uv.y * 8.0))));
    float scratch = stripe * scratchShape * 0.27;
    col = mix(col, vec3(1.0), scratch * 0.16);

    return clamp(col, 0.0, 1.0);
  }

  // ---- SDF: Rounded Rectangle ----
  float sdRoundRect(vec2 p, vec2 halfSize, float r) {
    vec2 d = abs(p) - halfSize + r;
    return length(max(d, 0.0)) + min(max(d.x, d.y), 0.0) - r;
  }

  // ---- Mode C: Mosaic / Pixelate within circle ----
  vec2 mosaicUV(vec2 uv, float blockSize, vec2 texSize) {
    vec2 blocks = texSize / max(blockSize, 1.0);
    return floor(uv * blocks) / blocks + 0.5 / blocks;
  }

  void main() {
    vec2 uv = v_uv;
    float screenAspect = u_resolution.x / u_resolution.y;
    float imgAspect = u_texSize.x / u_texSize.y;

    // Cover crop
    vec2 texUV = uv;
    if (screenAspect > imgAspect) {
      float scale = imgAspect / screenAspect;
      texUV.y = uv.y * scale + (1.0 - scale) * 0.5;
    } else {
      float scale = screenAspect / imgAspect;
      texUV.x = uv.x * scale + (1.0 - scale) * 0.5;
    }

    vec4 imgColor;

    if (u_mode < 0.5) {
      // Mode 0: Barrel fisheye
      vec2 distorted = barrelDistort(texUV, u_center, u_strength, screenAspect);
      distorted = clamp(distorted, vec2(0.0), vec2(1.0));
      imgColor = texture2D(u_tex, distorted);

      // Lens effects
      vec2 effectDelta = texUV - u_center;
      effectDelta.x *= screenAspect;
      float effectDist = length(effectDelta);
      float effectRadius = u_radius;
      float normalizedDist = effectDist / max(effectRadius, 0.01);

      float caStrength = 0.004 * smoothstep(0.3, 1.0, normalizedDist);
      vec2 caDir = normalize(texUV - u_center + vec2(0.0001));
      vec2 uvR = clamp(distorted + caDir * caStrength, vec2(0.0), vec2(1.0));
      vec2 uvB = clamp(distorted - caDir * caStrength, vec2(0.0), vec2(1.0));
      imgColor.r = texture2D(u_tex, uvR).r;
      imgColor.b = texture2D(u_tex, uvB).b;

      float vignette = 1.0 - 0.25 * smoothstep(0.4, 1.0, normalizedDist);
      imgColor.rgb *= mix(1.0, vignette, 0.5);

      vec2 flareCenter = u_center + vec2(0.25, 0.20);
      vec2 flareDelta = texUV - flareCenter;
      flareDelta.x *= screenAspect;
      float flare = exp(-dot(flareDelta,flareDelta) * 12.0) * 0.15;
      vec2 flare2Center = u_center + vec2(0.15, 0.25);
      vec2 flare2Delta = texUV - flare2Center;
      flare2Delta.x *= screenAspect;
      float flare2 = exp(-dot(flare2Delta,flare2Delta) * 25.0) * 0.08;
      imgColor.rgb += vec3(1.0, 0.7, 0.3) * flare + vec3(0.4, 0.5, 1.0) * flare2;

      float luma = dot(imgColor.rgb, vec3(0.299, 0.587, 0.114));
      imgColor.rgb = mix(imgColor.rgb, vec3(luma), 0.03);
      imgColor.rgb += vec3(-0.003, 0.0, 0.006) * (1.0 - normalizedDist);

      float frameRadius = u_radius;
      vec4 frame = renderFrame(uv, u_center, frameRadius, screenAspect, u_frameColor);
      gl_FragColor = vec4(mix(frame.rgb, imgColor.rgb, frame.a), 1.0);

    } else if (u_mode < 1.5) {
      // Mode 1: Bulge / Magnifier
      vec2 distorted = bulgeDistort(texUV, u_center, u_radius * 1.6, u_strength, screenAspect);
      distorted = clamp(distorted, vec2(0.0), vec2(1.0));
      imgColor = texture2D(u_tex, distorted);

      vec2 effectDelta = texUV - u_center;
      effectDelta.x *= screenAspect;
      float effectDist = length(effectDelta);
      float effectRadius = u_radius + 0.08;
      float normalizedDist = effectDist / max(effectRadius, 0.01);

      float caStrength = 0.004 * smoothstep(0.3, 1.0, normalizedDist);
      vec2 caDir = normalize(texUV - u_center + vec2(0.0001));
      vec2 uvR = clamp(distorted + caDir * caStrength, vec2(0.0), vec2(1.0));
      vec2 uvB = clamp(distorted - caDir * caStrength, vec2(0.0), vec2(1.0));
      imgColor.r = texture2D(u_tex, uvR).r;
      imgColor.b = texture2D(u_tex, uvB).b;

      float vignette = 1.0 - 0.25 * smoothstep(0.4, 1.0, normalizedDist);
      imgColor.rgb *= mix(1.0, vignette, 0.5);

      vec2 flareCenter = u_center + vec2(0.25, 0.20);
      vec2 flareDelta = texUV - flareCenter;
      flareDelta.x *= screenAspect;
      float flare = exp(-dot(flareDelta,flareDelta) * 12.0) * 0.15;
      vec2 flare2Center = u_center + vec2(0.15, 0.25);
      vec2 flare2Delta = texUV - flare2Center;
      flare2Delta.x *= screenAspect;
      float flare2 = exp(-dot(flare2Delta,flare2Delta) * 25.0) * 0.08;
      imgColor.rgb += vec3(1.0, 0.7, 0.3) * flare + vec3(0.4, 0.5, 1.0) * flare2;

      float luma = dot(imgColor.rgb, vec3(0.299, 0.587, 0.114));
      imgColor.rgb = mix(imgColor.rgb, vec3(luma), 0.03);
      imgColor.rgb += vec3(-0.003, 0.0, 0.006) * (1.0 - normalizedDist);

      float frameRadius = u_radius + 0.08;
      vec4 frame = renderFrame(uv, u_center, frameRadius, screenAspect, u_frameColor);
      gl_FragColor = vec4(mix(frame.rgb, imgColor.rgb, frame.a), 1.0);

    } else if (u_mode < 2.5) {
      // Mode 2: Mosaic — pixelate inside circle, clear outside
      vec2 delta = texUV - u_center;
      delta.x *= screenAspect;
      float dist = length(delta);
      float mosaicRadius = u_radius;

      // Block size: strength 0~1.5 maps to 2~80 pixel blocks
      float blockSize = mix(2.0, 80.0, u_strength / 1.5);

      // Soft fade at the edge: mosaic blends smoothly into original
      float mosAlpha = 1.0 - smoothstep(mosaicRadius - 0.04, mosaicRadius, dist);
      vec2 mosUV = mosaicUV(texUV, blockSize, u_texSize);
      vec4 mosColor = texture2D(u_tex, mosUV);
      vec4 clearColor = texture2D(u_tex, texUV);
      imgColor = mix(clearColor, mosColor, mosAlpha);

      // No frame for mosaic mode
      gl_FragColor = vec4(imgColor.rgb, 1.0);

    } else if (u_mode < 3.5) {
      // Mode 3: Sticker — 3D puffy gel sticker effect
      // 1. Bulge distortion for the "puffed up" shape
      float stickerRadius = u_radius;
      vec2 delta = texUV - u_center;
      delta.x *= screenAspect;
      float dist = length(delta);
      float nd = dist / max(stickerRadius, 0.001); // normalized dist [0,1] inside

      // Bulge the image (reuse bulge function)
      vec2 distorted = bulgeDistort(texUV, u_center, stickerRadius * 1.2, u_strength, screenAspect);
      distorted = clamp(distorted, vec2(0.0), vec2(1.0));
      imgColor = texture2D(u_tex, distorted);

      if (nd < 1.0) {
        // --- Inside the sticker ---

        // Sphere height at this point (for lighting)
        float z = sqrt(max(0.0, 1.0 - nd * nd));

        // 2. Gel / resin color tint — lighten + slight pastel shift
        imgColor.rgb = mix(imgColor.rgb, vec3(1.0), 0.12 * u_strength); // lighten
        imgColor.rgb *= vec3(1.02, 1.0, 1.03); // very slight cool pastel

        // 3. Specular highlight (top-left light source)
        vec3 lightDir = normalize(vec3(-0.45, -0.5, 0.8));
        vec3 normal = normalize(vec3(delta.x, delta.y, z * stickerRadius));
        vec3 viewDir = vec3(0.0, 0.0, 1.0);
        vec3 halfVec = normalize(lightDir + viewDir);
        float specular = pow(max(dot(normal, halfVec), 0.0), 40.0);
        // Broad soft highlight
        float softSpec = pow(max(dot(normal, halfVec), 0.0), 8.0);

        // Add crisp specular + soft glow
        imgColor.rgb += vec3(1.0) * specular * 0.7;
        imgColor.rgb += vec3(1.0, 0.98, 0.95) * softSpec * 0.15;

        // 4. Rim light (edge catch light for gel look)
        float rim = pow(1.0 - z, 3.0);
        imgColor.rgb += vec3(1.0, 0.95, 0.9) * rim * 0.12;

        // 5. Subtle refraction rainbow at edges (iridescence)
        float rainbow = pow(1.0 - z, 2.0) * 0.06;
        float angle = atan(delta.y, delta.x);
        imgColor.r += rainbow * (0.5 + 0.5 * sin(angle * 2.0));
        imgColor.g += rainbow * (0.5 + 0.5 * sin(angle * 2.0 + 2.09));
        imgColor.b += rainbow * (0.5 + 0.5 * sin(angle * 2.0 + 4.19));

      } else {
        // Outside sticker: show original image
        imgColor = texture2D(u_tex, texUV);
      }

      // 6. Drop shadow (offset down-right, behind the sticker)
      vec2 shadowOffset = vec2(0.012, 0.018);
      vec2 shadowDelta = texUV - u_center - shadowOffset;
      shadowDelta.x *= screenAspect;
      float shadowDist = length(shadowDelta);
      float shadow = smoothstep(stickerRadius + 0.03, stickerRadius - 0.01, shadowDist);
      // Only apply shadow outside the sticker itself
      if (nd >= 1.0) {
        imgColor.rgb *= 1.0 - shadow * 0.35;
      }

      // Frame
      float frameRadius = u_radius + 0.08;
      vec4 frame = renderFrame(uv, u_center, frameRadius, screenAspect, u_frameColor);
      gl_FragColor = vec4(mix(frame.rgb, imgColor.rgb, frame.a), 1.0);

    } else if (u_mode < 4.5) {
      // Mode 4: Peel-off film template.
      // Uses image 27.png as the paper/frame texture. The user photo sits in
      // the central window; the original white window acts as the peel cover.

      float screenAR = u_resolution.x / u_resolution.y;
      float peelAR = u_peelTexSize.x / u_peelTexSize.y;
      float peelScale = 0.86;
      float halfH = peelScale * 0.5;
      float halfW = halfH * peelAR / screenAR;

      vec2 tmplMin = vec2(0.5 - halfW, 0.5 - halfH);
      vec2 tmplSize = vec2(halfW * 2.0, halfH * 2.0);
      vec2 pUV = (uv - tmplMin) / tmplSize;

      vec3 bgColor = vec3(0.0);
      if (pUV.x < 0.0 || pUV.x > 1.0 || pUV.y < 0.0 || pUV.y > 1.0) {
        gl_FragColor = vec4(bgColor, 1.0);
      } else {
        vec4 paper = texture2D(u_peelTex, pUV);
        vec3 result = mix(bgColor, paper.rgb, paper.a);

        // Central photo window inside the supplied template.
        vec2 cardMinP = vec2(0.074, 0.064);
        vec2 cardMaxP = vec2(0.926, 0.712);
        vec2 cardSizeP = cardMaxP - cardMinP;
        bool inCard = pUV.x >= cardMinP.x && pUV.x <= cardMaxP.x &&
                      pUV.y >= cardMinP.y && pUV.y <= cardMaxP.y;

        vec2 localUV = (pUV - cardMinP) / cardSizeP;

        // Cover-crop the user photo into the template's photo window.
        float photoAR = u_texSize.x / u_texSize.y;
        float cardAR = cardSizeP.x * u_peelTexSize.x / (cardSizeP.y * u_peelTexSize.y);
        vec2 photoUV = localUV;
        if (photoAR > cardAR) {
          float sc = cardAR / photoAR;
          photoUV.x = localUV.x * sc + (1.0 - sc) * 0.5;
        } else {
          float sc = photoAR / cardAR;
          photoUV.y = localUV.y * sc + (1.0 - sc) * 0.5;
        }
        photoUV = clamp(photoUV, vec2(0.0), vec2(1.0));
        vec3 photoCol = texture2D(u_tex, photoUV).rgb;
        photoCol = applyPeelPhotoLook(photoCol, photoUV);

        // Base layer: template first, photo only inside the window.
        if (inCard) result = photoCol;

        // Match JS hit testing: convert the same template photo window into screen UV.
        vec2 cardMin = tmplMin + tmplSize * cardMinP;
        vec2 cardSize = tmplSize * cardSizeP;

        vec2 peelLocal = (u_peelPos - cardMin) / cardSize;
        vec2 cornerLocal = u_peelCorner;
        float dragDist = distance(cornerLocal, peelLocal);

        // Clean dark grey peel cover.
        float coverGrad = dot(clamp(localUV, vec2(0.0), vec2(1.0)), vec2(0.25, 0.75));
        vec3 coverCol = vec3(0.10, 0.10, 0.11) + vec3(0.035) * coverGrad;

        // Treat small JS/shader coordinate mismatches as fully closed.
        // Otherwise switching into peel mode can start in a tiny partially-peeled state.
        if (u_peelClosed > 0.5 || dragDist < 0.03) {
          if (inCard) result = coverCol;
        } else {
          vec2 mid = (cornerLocal + peelLocal) * 0.5;
          vec2 foldN = normalize(peelLocal - cornerLocal);
          float d = dot(localUV - mid, foldN);
          float curlR = max(0.012, 0.026 * u_strength);
          float curlLen = 3.14159 * curlR;
          // Keep the entire peeling process inside the central photo viewport so the
          // dark film never touches the asset's antialiased border/frame.
          bool inFilmBounds = inCard;

          if (inCard && d > curlLen) {
            result = coverCol;
          } else if (inFilmBounds && d > 0.0 && d <= curlLen) {
            float arc = curlLen - d;
            float ang = arc / curlR;
            vec3 backCol = vec3(0.28, 0.285, 0.30);

            float nz = cos(ang);
            float ny = sin(ang);
            vec3 curlN = normalize(vec3(-foldN * ny, nz));
            vec3 lDir = normalize(vec3(-0.4, -0.5, 0.8));
            vec3 vDir = vec3(0.0, 0.0, 1.0);
            float diff = max(dot(curlN, lDir), 0.0);
            vec3 hDir = normalize(lDir + vDir);
            float sp = pow(max(dot(curlN, hDir), 0.0), 64.0);

            vec3 curlCol = backCol * (0.68 + 0.32 * diff);
            curlCol += vec3(1.0) * sp * 0.25;

            float sh = smoothstep(0.0, curlLen * 0.5, arc) * 0.22;
            vec3 below = result * (1.0 - sh);
            float curlZ = curlR * (1.0 - cos(ang));
            float alpha = smoothstep(0.0, 0.004, curlZ);
            result = mix(below, curlCol, alpha);
          } else if (inCard) {
            float eDist = -d;
            float sh = exp(-eDist * 12.0) * 0.12;
            result = photoCol * (1.0 - sh);
          }
        }

        gl_FragColor = vec4(mix(bgColor, result, paper.a), 1.0);
      }

    } else if (u_mode < 5.5) {
      // Mode 5: Folder Icon — layered compositing approach
      // Layer order: background → back layer (folder shell) → photo → front layer (effects/lines)

      float screenAR = u_resolution.x / u_resolution.y;

      // Folder texture aspect (1004 × 854)
      float folderAR = u_folderTexSize.x / u_folderTexSize.y;

      // Scale folder to ~50% viewport height, centered
      float folderScale = 0.50;
      float halfH = folderScale * 0.5;
      float halfW = halfH * folderAR / screenAR;

      // Map screen UV → folder texture UV [0,1]
      vec2 fUV = vec2(
        (uv.x - (0.5 - halfW)) / (halfW * 2.0),
        (uv.y - (0.5 - halfH)) / (halfH * 2.0)
      );

      vec3 bgColor = vec3(0.0);

      if (fUV.x < 0.0 || fUV.x > 1.0 || fUV.y < 0.0 || fUV.y > 1.0) {
        gl_FragColor = vec4(bgColor, 1.0);
      } else {
        // 1) Sample back layer (folder shell: outline + tab + shadow)
        vec4 backSample = texture2D(u_folderTex, fUV);

        // Start with background, composite back layer over it
        vec3 result = mix(bgColor, backSample.rgb, backSample.a);

        // 2) Composite photo on top wherever back layer has content
        if (backSample.a > 0.01) {
          // Folder content bounds in texture UV (x:32..972, y:16..806 in 1004×854)
          vec2 contentMin = vec2(32.0 / 1004.0, 16.0 / 854.0);
          vec2 contentMax = vec2(972.0 / 1004.0, 806.0 / 854.0);
          vec2 contentSize = contentMax - contentMin;

          // Map folder UV to content-local [0,1]
          vec2 cLocal = (fUV - contentMin) / contentSize;
          cLocal -= u_photoOffset;

          // Cover crop photo into content area
          float photoAR = u_texSize.x / u_texSize.y;
          float contentAR = contentSize.x * u_folderTexSize.x /
                           (contentSize.y * u_folderTexSize.y);

          vec2 photoUV = cLocal;
          if (photoAR > contentAR) {
            float sc = contentAR / photoAR;
            photoUV.x = cLocal.x * sc + (1.0 - sc) * 0.5;
          } else {
            float sc = photoAR / contentAR;
            photoUV.y = cLocal.y * sc + (1.0 - sc) * 0.5;
          }
          photoUV = clamp(photoUV, vec2(0.0), vec2(1.0));
          vec3 photoCol = texture2D(u_tex, photoUV).rgb;

          // Place photo directly on top of back layer (replaces folder fill)
          result = photoCol;
        }

        // 3) Overlay front layer (inner shadow, highlight, decorative lines)
        //    Use multiply-blend so white areas are transparent and dark areas (shadows) darken the photo
        vec4 frontSample = texture2D(u_folderFrontTex, fUV);
        if (frontSample.a > 0.01) {
          // Multiply blend: result * frontColor preserves bright areas, darkens with shadows
          vec3 frontMul = result * frontSample.rgb;
          // Blend strength controlled by front alpha
          result = mix(result, frontMul, frontSample.a);
          // Re-add any bright highlights (white-on-white lines) as additive
          float frontLum = dot(frontSample.rgb, vec3(0.299, 0.587, 0.114));
          // Decorative lines are white with low alpha — they should lighten, not darken
          // If front pixel is bright and semi-transparent, add a slight highlight
          float highlight = max(0.0, frontLum - 0.9) * frontSample.a * 3.0;
          result += vec3(highlight);
        }

        // 4) Re-apply back layer alpha for clean outer edge
        gl_FragColor = vec4(mix(bgColor, result, backSample.a), 1.0);
      }
    } else {
      // Mode 6: Die-cut sticker — alpha cutout + white outline + drop shadow.
      // Intended to be used after BG removal, but also works as a rectangular sticker
      // for ordinary opaque images.
      float stickerScale = 0.68;
      float halfH = stickerScale * 0.5;
      float halfW = halfH * imgAspect / screenAspect;
      if (halfW > 0.46) {
        halfW = 0.46;
        halfH = halfW * screenAspect / imgAspect;
      }

      vec2 stickerMin = vec2(0.5 - halfW, 0.5 - halfH);
      vec2 stickerSize = vec2(halfW * 2.0, halfH * 2.0);
      vec2 sUV = (uv - stickerMin) / stickerSize;
      vec3 bgColor = vec3(0.0);
      vec3 result = bgColor;

      vec2 outlinePx = vec2(18.0) / u_texSize;
      vec2 shadowOffset = vec2(0.025, 0.035);
      vec2 shadowUV = sUV - shadowOffset;
      float shadowAlpha = 0.0;
      if (shadowUV.x >= 0.0 && shadowUV.x <= 1.0 && shadowUV.y >= 0.0 && shadowUV.y <= 1.0) {
        shadowAlpha = texture2D(u_tex, shadowUV).a;
      }
      result = mix(result, vec3(0.0), shadowAlpha * 0.34);

      if (sUV.x >= 0.0 && sUV.x <= 1.0 && sUV.y >= 0.0 && sUV.y <= 1.0) {
        vec4 sampleCol = texture2D(u_tex, sUV);
        float a = sampleCol.a;
        float outlineA = 0.0;
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 1.0,  0.0)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2(-1.0,  0.0)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.0,  1.0)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.0, -1.0)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.707,  0.707)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2(-0.707,  0.707)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.707, -0.707)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2(-0.707, -0.707)).a);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 1.8,  0.0)).a * 0.8);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2(-1.8,  0.0)).a * 0.8);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.0,  1.8)).a * 0.8);
        outlineA = max(outlineA, texture2D(u_tex, sUV + outlinePx * vec2( 0.0, -1.8)).a * 0.8);

        float whiteEdge = smoothstep(0.02, 0.35, outlineA) * (1.0 - smoothstep(0.45, 0.9, a));
        result = mix(result, vec3(1.0), whiteEdge);
        vec3 printCol = sampleCol.rgb;
        printCol = mix(printCol, vec3(1.0), 0.03);
        result = mix(result, printCol, a);
      }

      gl_FragColor = vec4(result, 1.0);
    }
  }
