function initGL() {
  canvas = document.getElementById('glCanvas');
  canvasWrap = document.getElementById('canvasWrap');
  crosshair = document.getElementById('crosshair');
  radiusRing = document.getElementById('radiusRing');

  gl = canvas.getContext('webgl', { preserveDrawingBuffer: true, antialias: false });
  if (!gl) { alert('WebGL not supported'); return; }

  // Compile shaders
  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, VERT); gl.compileShader(vs);
  if (!gl.getShaderParameter(vs, gl.COMPILE_STATUS)) console.error('VS:', gl.getShaderInfoLog(vs));
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, FRAG); gl.compileShader(fs);
  if (!gl.getShaderParameter(fs, gl.COMPILE_STATUS)) console.error('FS:', gl.getShaderInfoLog(fs));

  program = gl.createProgram();
  gl.attachShader(program, vs); gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) console.error('Link:', gl.getProgramInfoLog(program));
  gl.useProgram(program);

  // Fullscreen quad
  posBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(program, 'a_pos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  // Uniforms
  uCenter     = gl.getUniformLocation(program, 'u_center');
  uRadius     = gl.getUniformLocation(program, 'u_radius');
  uStrength   = gl.getUniformLocation(program, 'u_strength');
  uMode       = gl.getUniformLocation(program, 'u_mode');
  uResolution = gl.getUniformLocation(program, 'u_resolution');
  uTexSize    = gl.getUniformLocation(program, 'u_texSize');
  uFrameColor = gl.getUniformLocation(program, 'u_frameColor');
  uPeelPos    = gl.getUniformLocation(program, 'u_peelPos');
  uPeelCorner = gl.getUniformLocation(program, 'u_peelCorner');
  uPeelClosed = gl.getUniformLocation(program, 'u_peelClosed');
  uTime       = gl.getUniformLocation(program, 'u_time');
  uPeelTex    = gl.getUniformLocation(program, 'u_peelTex');
  uPeelTexSize= gl.getUniformLocation(program, 'u_peelTexSize');
  uFolderColor   = gl.getUniformLocation(program, 'u_folderColor');
  uFolderTabColor= gl.getUniformLocation(program, 'u_folderTabColor');
  uPhotoOffset   = gl.getUniformLocation(program, 'u_photoOffset');
  uFolderTex     = gl.getUniformLocation(program, 'u_folderTex');
  uFolderFrontTex= gl.getUniformLocation(program, 'u_folderFrontTex');
  uFolderTexSize = gl.getUniformLocation(program, 'u_folderTexSize');

  // Photo texture (unit 0)
  texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  // Peel template texture (unit 3) — loaded from image 27.png
  peelTexture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, peelTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  // Folder back texture (unit 1) — will be loaded from FolderBack.svg
  folderTexture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, folderTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  // Folder front texture (unit 2) — will be loaded from FolderFront.svg
  folderFrontTexture = gl.createTexture();
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, folderFrontTexture);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);

  gl.activeTexture(gl.TEXTURE0);

  // Load Folder.svg as texture
  loadFolderTexture();
  loadPeelTexture();
}

function loadPeelTexture() {
  const img = new Image();
  img.onload = function() {
    let sw = img.naturalWidth || img.width;
    let sh = img.naturalHeight || img.height;
    let source = img;
    const maxDim = 4096;
    if (Math.max(sw, sh) > maxDim) {
      const scale = maxDim / Math.max(sw, sh);
      const oc = document.createElement('canvas');
      oc.width = Math.round(sw * scale);
      oc.height = Math.round(sh * scale);
      oc.getContext('2d').drawImage(img, 0, 0, oc.width, oc.height);
      source = oc;
      sw = oc.width;
      sh = oc.height;
    }
    peelTexWidth = sw;
    peelTexHeight = sh;
    gl.activeTexture(gl.TEXTURE3);
    gl.bindTexture(gl.TEXTURE_2D, peelTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
    gl.activeTexture(gl.TEXTURE0);
  };
  img.src = 'image%2027.png';
}

function loadFolderTexture() {
  const svgW = 1004, svgH = 854;
  const scale = 2;

  // Load back layer
  const imgBack = new Image();
  imgBack.onload = function() {
    const oc = document.createElement('canvas');
    oc.width = svgW * scale;
    oc.height = svgH * scale;
    const ctx = oc.getContext('2d');
    ctx.drawImage(imgBack, 0, 0, oc.width, oc.height);

    folderTexWidth = oc.width;
    folderTexHeight = oc.height;

    gl.activeTexture(gl.TEXTURE1);
    gl.bindTexture(gl.TEXTURE_2D, folderTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, oc);
    gl.activeTexture(gl.TEXTURE0);
    folderTexReady = true;
  };
  imgBack.src = 'FolderBack.svg';

  // Load front layer
  const imgFront = new Image();
  imgFront.onload = function() {
    const oc = document.createElement('canvas');
    oc.width = svgW * scale;
    oc.height = svgH * scale;
    const ctx = oc.getContext('2d');
    ctx.drawImage(imgFront, 0, 0, oc.width, oc.height);

    gl.activeTexture(gl.TEXTURE2);
    gl.bindTexture(gl.TEXTURE_2D, folderFrontTexture);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, oc);
    gl.activeTexture(gl.TEXTURE0);
    folderFrontTexReady = true;
  };
  imgFront.src = 'FolderFront.svg';
}

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  canvas.width = w * dpr;
  canvas.height = h * dpr;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  gl.viewport(0, 0, canvas.width, canvas.height);
}

function render() {
  if (!S.imgLoaded) { rafId = requestAnimationFrame(render); return; }

  // Peel-off spring animation
  if (S.peelSpringActive && !S.peelDragging) {
    // Closed target = the active corner's screen UV position
    const closedUV = getCardCornerUV(S.peelCornerX, S.peelCornerY);
    // Open target = opposite corner, extended past it so film fully peels off
    const oppositeUV = getCardCornerUV(1.0 - S.peelCornerX, 1.0 - S.peelCornerY);
    const extX = S.peelOpen ? oppositeUV.x + (oppositeUV.x - closedUV.x) * 1.35 : closedUV.x;
    const extY = S.peelOpen ? oppositeUV.y + (oppositeUV.y - closedUV.y) * 1.35 : closedUV.y;
    const tx = extX;
    const ty = extY;
    const dx = tx - S.peelX, dy = ty - S.peelY;
    const k = 0.12, damp = 0.75;
    S.peelVx = (S.peelVx + dx * k) * damp;
    S.peelVy = (S.peelVy + dy * k) * damp;
    S.peelX += S.peelVx;
    S.peelY += S.peelVy;
    if (Math.abs(dx) < 0.002 && Math.abs(dy) < 0.002 && Math.abs(S.peelVx) < 0.001) {
      S.peelX = tx; S.peelY = ty;
      S.peelSpringActive = false;
    }
  }
  S.peelTime += 0.016;

  gl.uniform2f(uCenter, S.cx, S.cy);
  gl.uniform1f(uRadius, S.radius);
  gl.uniform1f(uStrength, S.strength);
  gl.uniform1f(uMode, S.mode);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform2f(uTexSize, imgWidth, imgHeight);
  gl.uniform1f(uFrameColor, S.frameColor);
  gl.uniform2f(uPeelPos, S.peelX, S.peelY);
  gl.uniform2f(uPeelCorner, S.peelCornerX, S.peelCornerY);
  gl.uniform1f(uPeelClosed, (!S.peelDragging && !S.peelSpringActive && !S.peelOpen) ? 1.0 : 0.0);
  gl.uniform2f(uPeelTexSize, peelTexWidth, peelTexHeight);
  gl.uniform1f(uTime, S.peelTime);

  const fc = FOLDER_COLORS[S.folderColorIdx];
  gl.uniform3f(uFolderColor, fc.body[0], fc.body[1], fc.body[2]);
  gl.uniform3f(uFolderTabColor, fc.tab[0], fc.tab[1], fc.tab[2]);
  gl.uniform2f(uPhotoOffset, S.photoOffX, S.photoOffY);

  // Bind textures
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.uniform1i(gl.getUniformLocation(program, 'u_tex'), 0);
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, folderTexture);
  gl.uniform1i(uFolderTex, 1);
  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_2D, folderFrontTexture);
  gl.uniform1i(uFolderFrontTex, 2);
  gl.activeTexture(gl.TEXTURE3);
  gl.bindTexture(gl.TEXTURE_2D, peelTexture);
  gl.uniform1i(uPeelTex, 3);
  gl.uniform2f(uFolderTexSize, folderTexWidth, folderTexHeight);
  gl.activeTexture(gl.TEXTURE0);

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);

  updateOverlay();
  rafId = requestAnimationFrame(render);
}

// ============================================================
//  Image Loading
// ============================================================
function loadImageToGL(img) {
  imgWidth = img.naturalWidth || img.width;
  imgHeight = img.naturalHeight || img.height;

  // Limit texture size for mobile
  const maxDim = 4096;
  let sw = imgWidth, sh = imgHeight;
  if (Math.max(sw, sh) > maxDim) {
    const scale = maxDim / Math.max(sw, sh);
    sw = Math.round(sw * scale);
    sh = Math.round(sh * scale);
    const oc = document.createElement('canvas');
    oc.width = sw; oc.height = sh;
    oc.getContext('2d').drawImage(img, 0, 0, sw, sh);
    img = oc;
    imgWidth = sw; imgHeight = sh;
  }

  const source = document.createElement('canvas');
  source.width = imgWidth;
  source.height = imgHeight;
  source.getContext('2d').drawImage(img, 0, 0, imgWidth, imgHeight);
  sourceImageCanvas = source;
  img = source;

  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  S.imgLoaded = true;

  resizeCanvas();
}

let backgroundRemovalWorker = null;
let backgroundRemovalRequestId = 0;
let backgroundRemovalBusy = false;

function canvasToPngArrayBuffer(source) {
  return new Promise((resolve, reject) => {
    source.toBlob(async blob => {
      if (!blob) {
        reject(new Error('无法准备图片'));
        return;
      }
      try {
        resolve(await blob.arrayBuffer());
      } catch (error) {
        reject(error);
      }
    }, 'image/png');
  });
}

function pixelsToCanvas(pixels, width, height) {
  const output = document.createElement('canvas');
  output.width = width;
  output.height = height;
  const ctx = output.getContext('2d');
  ctx.putImageData(new ImageData(new Uint8ClampedArray(pixels), width, height), 0, 0);
  return output;
}

const DIE_CUT_ALPHA_THRESHOLD = 26;
const DISTANCE_INFINITY = 1_000_000_000_000;

function clampNumber(value, min, max) {
  return Math.min(max, Math.max(min, value));
}

function distanceTransform1D(source, sourceOffset, sourceStride, target, targetOffset, targetStride, length, parabolas, boundaries) {
  let envelopeIndex = 0;
  parabolas[0] = 0;
  boundaries[0] = Number.NEGATIVE_INFINITY;
  boundaries[1] = Number.POSITIVE_INFINITY;

  for (let position = 1; position < length; position++) {
    let previous = parabolas[envelopeIndex];
    let intersection = (
      source[sourceOffset + position * sourceStride] + position * position -
      (source[sourceOffset + previous * sourceStride] + previous * previous)
    ) / (2 * position - 2 * previous);
    while (intersection <= boundaries[envelopeIndex]) {
      envelopeIndex--;
      previous = parabolas[envelopeIndex];
      intersection = (
        source[sourceOffset + position * sourceStride] + position * position -
        (source[sourceOffset + previous * sourceStride] + previous * previous)
      ) / (2 * position - 2 * previous);
    }
    envelopeIndex++;
    parabolas[envelopeIndex] = position;
    boundaries[envelopeIndex] = intersection;
    boundaries[envelopeIndex + 1] = Number.POSITIVE_INFINITY;
  }

  envelopeIndex = 0;
  for (let position = 0; position < length; position++) {
    while (boundaries[envelopeIndex + 1] < position) envelopeIndex++;
    const nearest = parabolas[envelopeIndex];
    const delta = position - nearest;
    target[targetOffset + position * targetStride] = delta * delta + source[sourceOffset + nearest * sourceStride];
  }
}

function expandAlpha(source, radius) {
  const width = source.width;
  const height = source.height;
  const sourceContext = source.getContext('2d', { willReadFrequently: true });
  const sourcePixels = sourceContext.getImageData(0, 0, width, height).data;
  const size = width * height;
  const seeds = new Float32Array(size);
  const rowDistances = new Float32Array(size);
  let hasSeed = false;

  for (let pixel = 0; pixel < size; pixel++) {
    const occupied = sourcePixels[pixel * 4 + 3] >= DIE_CUT_ALPHA_THRESHOLD;
    seeds[pixel] = occupied ? 0 : DISTANCE_INFINITY;
    hasSeed ||= occupied;
  }

  const maxLength = Math.max(width, height);
  const parabolas = new Int32Array(maxLength);
  const boundaries = new Float64Array(maxLength + 1);
  if (hasSeed) {
    for (let y = 0; y < height; y++) {
      distanceTransform1D(seeds, y * width, 1, rowDistances, y * width, 1, width, parabolas, boundaries);
    }
    for (let x = 0; x < width; x++) {
      distanceTransform1D(rowDistances, x, width, seeds, x, width, height, parabolas, boundaries);
    }
  }

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext('2d');
  const mask = context.createImageData(width, height);
  for (let pixel = 0; pixel < size; pixel++) {
    const coverage = hasSeed ? clampNumber(radius + 0.5 - Math.sqrt(seeds[pixel]), 0, 1) : 0;
    const offset = pixel * 4;
    mask.data[offset] = 255;
    mask.data[offset + 1] = 255;
    mask.data[offset + 2] = 255;
    mask.data[offset + 3] = Math.round(coverage * 255);
  }
  context.putImageData(mask, 0, 0);
  return canvas;
}

function tintAlpha(source, color) {
  const canvas = document.createElement('canvas');
  canvas.width = source.width;
  canvas.height = source.height;
  const context = canvas.getContext('2d');
  context.fillStyle = color;
  context.fillRect(0, 0, canvas.width, canvas.height);
  context.globalCompositeOperation = 'destination-in';
  context.drawImage(source, 0, 0);
  return canvas;
}

function addDieCutOutline(source, outlineWidth = 18, outlineColor = '#ffffff') {
  const radius = clampNumber(outlineWidth * 2.35, 0, 112);
  const canvas = document.createElement('canvas');
  canvas.width = source.width;
  canvas.height = source.height;
  const context = canvas.getContext('2d');
  if (radius > 0.25) {
    const expanded = expandAlpha(source, radius);
    context.drawImage(tintAlpha(expanded, outlineColor), 0, 0);
  }
  context.drawImage(source, 0, 0);
  return canvas;
}

function getBackgroundRemovalWorker() {
  if (backgroundRemovalWorker) return backgroundRemovalWorker;
  backgroundRemovalWorker = new Worker('background-removal.worker.js', {
    type: 'module',
    name: 'cam-background-removal',
  });
  return backgroundRemovalWorker;
}

async function removeBackgroundAI() {
  if (!S.imgLoaded || !sourceImageCanvas) {
    showToast('请先上传图片');
    return;
  }
  if (backgroundRemovalBusy) return;
  backgroundRemovalBusy = true;
  showToast('正在加载抠图模型...');

  const worker = getBackgroundRemovalWorker();
  const id = ++backgroundRemovalRequestId;

  try {
    const image = await canvasToPngArrayBuffer(sourceImageCanvas);
    const result = await new Promise((resolve, reject) => {
      const cleanup = () => {
        worker.removeEventListener('message', onMessage);
        worker.removeEventListener('error', onError);
      };
      const onError = event => {
        cleanup();
        reject(new Error(event.message || '抠图 worker 失败'));
      };
      const onMessage = event => {
        const msg = event.data;
        if (!msg || msg.id !== id) return;
        if (msg.type === 'progress') {
          if (msg.phase === 'loading') {
            const pct = Number.isFinite(msg.progress) ? ` ${Math.round(msg.progress)}%` : '';
            showToast(`正在加载模型${pct}`);
          } else {
            showToast('正在抠图...');
          }
          return;
        }
        cleanup();
        if (msg.type === 'error') {
          reject(new Error(msg.message || '抠图失败'));
          return;
        }
        resolve(msg);
      };
      worker.addEventListener('message', onMessage);
      worker.addEventListener('error', onError);
      worker.postMessage({ type: 'remove', id, image, mimeType: 'image/png' }, [image]);
    });

    const cutout = pixelsToCanvas(result.pixels, result.width, result.height);
    sourceImageCanvas = cutout;
    loadImageToGL(cutout);
    showToast('抠图完成', true);
  } catch (error) {
    console.error('Background removal failed', error);
    showToast('抠图失败');
  } finally {
    backgroundRemovalBusy = false;
  }
}

function removeBackgroundNoAI() {
  if (!S.imgLoaded || !sourceImageCanvas) {
    showToast('请先上传图片');
    return;
  }

  const src = sourceImageCanvas;
  const w = src.width;
  const h = src.height;
  const work = document.createElement('canvas');
  work.width = w;
  work.height = h;
  const ctx = work.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(src, 0, 0);
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  // Estimate background from the image border.
  const samples = [];
  const step = Math.max(1, Math.floor(Math.min(w, h) / 80));
  function addSample(x, y) {
    const i = (y * w + x) * 4;
    if (data[i + 3] > 10) samples.push([data[i], data[i + 1], data[i + 2]]);
  }
  for (let x = 0; x < w; x += step) { addSample(x, 0); addSample(x, h - 1); }
  for (let y = 0; y < h; y += step) { addSample(0, y); addSample(w - 1, y); }
  if (!samples.length) return;

  const bg = [0, 1, 2].map(c => {
    const vals = samples.map(s => s[c]).sort((a, b) => a - b);
    return vals[Math.floor(vals.length / 2)];
  });

  function colorDistAt(idx) {
    const dr = data[idx] - bg[0];
    const dg = data[idx + 1] - bg[1];
    const db = data[idx + 2] - bg[2];
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }

  // Adaptive threshold: works best on clean/plain backgrounds.
  const edgeDists = samples.map(s => {
    const dr = s[0] - bg[0], dg = s[1] - bg[1], db = s[2] - bg[2];
    return Math.sqrt(dr * dr + dg * dg + db * db);
  }).sort((a, b) => a - b);
  const edgeMedian = edgeDists[Math.floor(edgeDists.length * 0.65)] || 18;
  const threshold = Math.max(34, Math.min(86, edgeMedian + 38));
  const soft = 22;

  // Flood fill from edges to avoid deleting similarly-colored foreground islands.
  const bgMask = new Uint8Array(w * h);
  const queue = [];
  function pushIfBg(x, y) {
    if (x < 0 || x >= w || y < 0 || y >= h) return;
    const p = y * w + x;
    if (bgMask[p]) return;
    const i = p * 4;
    if (data[i + 3] < 10 || colorDistAt(i) < threshold) {
      bgMask[p] = 1;
      queue.push(p);
    }
  }
  for (let x = 0; x < w; x++) { pushIfBg(x, 0); pushIfBg(x, h - 1); }
  for (let y = 0; y < h; y++) { pushIfBg(0, y); pushIfBg(w - 1, y); }

  for (let q = 0; q < queue.length; q++) {
    const p = queue[q];
    const x = p % w;
    const y = Math.floor(p / w);
    pushIfBg(x + 1, y);
    pushIfBg(x - 1, y);
    pushIfBg(x, y + 1);
    pushIfBg(x, y - 1);
  }

  // Alpha matte with a soft transition near the sampled background color.
  for (let p = 0; p < w * h; p++) {
    const i = p * 4;
    if (bgMask[p]) {
      const d = colorDistAt(i);
      const a = Math.max(0, Math.min(1, (d - (threshold - soft)) / soft));
      data[i + 3] = Math.round(a * 255);
      if (data[i + 3] < 12) {
        data[i] = 0; data[i + 1] = 0; data[i + 2] = 0; data[i + 3] = 0;
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);
  sourceImageCanvas = work;
  loadImageToGL(work);
  showToast('已尝试去背景');
}

// ============================================================
//  Overlay UI (crosshair + radius ring)
// ============================================================
function updateOverlay() {
  const w = canvasWrap.clientWidth;
  const h = canvasWrap.clientHeight;
  const px = S.cx * w;
  const py = S.cy * h;

  crosshair.style.left = px + 'px';
  crosshair.style.top = py + 'px';

  if (S.mode === 4 || S.mode === 5) {
    // Peel/Folder mode: no crosshair/radius ring
    radiusRing.classList.add('hidden');
  } else if (S.mode === 1) {
    // 放大镜模式不显示 overlay 圆环（shader 已经画了边框）
    radiusRing.classList.add('hidden');
  } else {
    // 鱼眼模式下不显示 overlay 圆环（shader 已经画了圆形裁切）
    radiusRing.classList.add('hidden');
  }
}

// ============================================================
//  Touch / Mouse Interaction
// ============================================================
function setupTouch() {
  const el = canvasWrap;
  let lastTouches = [];

  function norm(clientX, clientY) {
    const rect = el.getBoundingClientRect();
    return {
      x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
      y: Math.max(0, Math.min(1, (clientY - rect.top) / rect.height))
    };
  }

  function dist2(t) {
    const dx = t[0].clientX - t[1].clientX;
    const dy = t[0].clientY - t[1].clientY;
    return Math.sqrt(dx*dx + dy*dy);
  }

  // Empty canvas upload entry. Use click (not touchstart) so mobile browsers
  // treat file input opening as a direct user activation.
  el.addEventListener('click', e => {
    if (!S.imgLoaded) {
      e.preventDefault();
      e.stopPropagation();
      pickImage();
    }
  });

  // --- Touch ---
  el.addEventListener('touchstart', e => {
    if (!S.imgLoaded) {
      return;
    }
    e.preventDefault();
    if (e.touches.length === 1) {
      const p = norm(e.touches[0].clientX, e.touches[0].clientY);
      if (S.mode === 4) {
        if (S.peelLocked) return;
        // Check if click is near any card corner (within 0.2 threshold)
        const closest = findClosestCorner(p.x, p.y);
        if (closest && closest.dist < 0.2) {
          S.peelCornerX = closest.localX;
          S.peelCornerY = closest.localY;
          S.peelX = p.x; S.peelY = p.y;
          S.peelDragging = true;
          S.peelSpringActive = false;
          S.peelVx = 0; S.peelVy = 0;
        }
      } else if (S.mode === 5) {
        if (isPointInFolder(e.touches[0].clientX, e.touches[0].clientY)) {
          S.folderDragging = true;
          S.folderDragStartX = e.touches[0].clientX;
          S.folderDragStartY = e.touches[0].clientY;
          S.folderOffStartX = S.photoOffX;
          S.folderOffStartY = S.photoOffY;
        }
      } else {
        S.dragging = true;
        crosshair.classList.add('active');
        radiusRing.classList.add('active');
        S.cx = p.x; S.cy = p.y;
      }
    }
    if (e.touches.length === 2 && S.mode !== 4 && S.mode !== 5) {
      S.pinching = true;
      S.pinchStartDist = dist2(e.touches);
      S.pinchStartRadius = S.radius;
    }
    lastTouches = [...e.touches];
  }, { passive: false });

  el.addEventListener('touchmove', e => {
    e.preventDefault();
    if (e.touches.length === 1) {
      const p = norm(e.touches[0].clientX, e.touches[0].clientY);
      if (S.mode === 4 && S.peelDragging) {
        S.peelX = p.x; S.peelY = p.y;
      } else if (S.mode === 5 && S.folderDragging) {
        const folderRect = getFolderRectPx();
        const contentW = folderRect.w * (940 / 1004);
        const contentH = folderRect.h * (790 / 854);
        S.photoOffX = S.folderOffStartX + (e.touches[0].clientX - S.folderDragStartX) / contentW;
        S.photoOffY = S.folderOffStartY + (e.touches[0].clientY - S.folderDragStartY) / contentH;
      } else if (S.dragging && !S.pinching) {
        S.cx = p.x; S.cy = p.y;
      }
    }
    if (e.touches.length === 2 && S.pinching) {
      const d = dist2(e.touches);
      const scale = d / S.pinchStartDist;
      S.radius = Math.max(0.05, Math.min(0.6, S.pinchStartRadius * scale));
      document.getElementById('radiusSlider').value = Math.round(S.radius * 100);
      document.getElementById('radiusVal').textContent = Math.round(S.radius * 100) + '%';
      const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      const p = norm(mx, my);
      S.cx = p.x; S.cy = p.y;
    }
  }, { passive: false });

  el.addEventListener('touchend', e => {
    if (e.touches.length < 2) S.pinching = false;
    if (e.touches.length === 0) {
      if (S.peelDragging) {
        S.peelDragging = false;
        // If dragged past 40% of card diagonal from the active corner, snap fully open; otherwise snap back
        const cornerUV = getCardCornerUV(S.peelCornerX, S.peelCornerY);
        const dx = cornerUV.x - S.peelX, dy = cornerUV.y - S.peelY;
        S.peelOpen = Math.sqrt(dx*dx + dy*dy) > 0.28;
        if (S.peelOpen) S.peelLocked = true;
        S.peelSpringActive = true;
      }
      S.folderDragging = false;
      S.dragging = false;
      crosshair.classList.remove('active');
      radiusRing.classList.remove('active');
    }
  });

  // --- Mouse (for desktop testing) ---
  el.addEventListener('mousedown', e => {
    if (!S.imgLoaded) {
      return;
    }
    const p = norm(e.clientX, e.clientY);
    if (S.mode === 4) {
      if (S.peelLocked) return;
      const closest = findClosestCorner(p.x, p.y);
      if (closest && closest.dist < 0.2) {
        S.peelCornerX = closest.localX;
        S.peelCornerY = closest.localY;
        S.peelX = p.x; S.peelY = p.y;
        S.peelDragging = true;
        S.peelSpringActive = false;
        S.peelVx = 0; S.peelVy = 0;
      }
    } else if (S.mode === 5) {
      if (isPointInFolder(e.clientX, e.clientY)) {
        S.folderDragging = true;
        S.folderDragStartX = e.clientX;
        S.folderDragStartY = e.clientY;
        S.folderOffStartX = S.photoOffX;
        S.folderOffStartY = S.photoOffY;
      }
    } else {
      S.dragging = true;
      crosshair.classList.add('active');
      radiusRing.classList.add('active');
      S.cx = p.x; S.cy = p.y;
    }
  });
  window.addEventListener('mousemove', e => {
    const p = norm(e.clientX, e.clientY);
    if (S.mode === 4 && S.peelDragging) {
      S.peelX = p.x; S.peelY = p.y;
    } else if (S.mode === 5 && S.folderDragging) {
      const folderRect = getFolderRectPx();
      const contentW = folderRect.w * (940 / 1004);
      const contentH = folderRect.h * (790 / 854);
      S.photoOffX = S.folderOffStartX + (e.clientX - S.folderDragStartX) / contentW;
      S.photoOffY = S.folderOffStartY + (e.clientY - S.folderDragStartY) / contentH;
    } else if (S.dragging) {
      S.cx = p.x; S.cy = p.y;
    }
  });
  window.addEventListener('mouseup', () => {
    if (S.peelDragging) {
      S.peelDragging = false;
      const cornerUV = getCardCornerUV(S.peelCornerX, S.peelCornerY);
      const dx = cornerUV.x - S.peelX, dy = cornerUV.y - S.peelY;
      S.peelOpen = Math.sqrt(dx*dx + dy*dy) > 0.28;
      if (S.peelOpen) S.peelLocked = true;
      S.peelSpringActive = true;
    }
    S.folderDragging = false;
    S.dragging = false;
    crosshair.classList.remove('active');
    radiusRing.classList.remove('active');
  });

  // Scroll wheel → radius (desktop)
  el.addEventListener('wheel', e => {
    e.preventDefault();
    S.radius = Math.max(0.05, Math.min(0.6, S.radius - e.deltaY * 0.0005));
    document.getElementById('radiusSlider').value = Math.round(S.radius * 100);
    document.getElementById('radiusVal').textContent = Math.round(S.radius * 100) + '%';
  }, { passive: false });
}

// ============================================================
//  Controls
// ============================================================
function onStrengthChange(v) {
  S.strength = v / 100;
  document.getElementById('strengthVal').textContent = v + '%';
}

function onRadiusChange(v) {
  S.radius = v / 100;
  document.getElementById('radiusVal').textContent = v + '%';
}

// Per-mode saved params
const modeParams = {
  0: { strength: 0.3, radius: 0.5, cx: 0.5, cy: 0.5 },
  1: { strength: 0.8, radius: 0.42, cx: 0.5, cy: 0.5 },
  2: { strength: 0.5, radius: 0.35, cx: 0.5, cy: 0.5 },
  3: { strength: 0.6, radius: 0.3, cx: 0.5, cy: 0.5 },
  4: { strength: 0.5, radius: 0.3, cx: 0.5, cy: 0.5 },
  5: { strength: 0.6, radius: 0.12, cx: 0.5, cy: 0.5 },
  6: { strength: 0.6, radius: 0.3, cx: 0.5, cy: 0.5 },
};

const modeNames = { 0: '鱼眼', 1: '放大镜', 2: '马赛克', 3: '贴纸', 4: '撕拉片', 5: '文件夹', 6: 'Die-cut' };

function switchMode(m) {
  // Save current params to old mode
  modeParams[S.mode] = { strength: S.strength, radius: S.radius, cx: S.cx, cy: S.cy };

  S.mode = m;
  S.peelDragging = false;
  S.peelSpringActive = false;
  document.querySelectorAll('.mode-item').forEach(b => b.classList.toggle('active', +b.dataset.mode === m));
  document.getElementById('modeTitle').textContent = modeNames[m];

  // Hide frame toggle for mosaic, peel-off, and folder mode
  document.getElementById('frameToggle').style.display = (m === 2 || m === 4 || m === 5 || m === 6) ? 'none' : 'flex';

  // Show/hide controls per mode
  const isPeel = m === 4;
  const isFolder = m === 5;
  const isDieCut = m === 6;
  const hideSliders = isPeel || isFolder || isDieCut;
  document.querySelector('.slider-group').style.display = hideSliders ? 'none' : '';
  document.getElementById('radiusGroup').style.display = hideSliders ? 'none' : '';
  crosshair.style.display = (isPeel || isFolder || isDieCut) ? 'none' : '';

  // Folder color picker — no longer needed, folder uses SVG original color
  document.getElementById('folderColorToggle').style.display = 'none';

  // Slider labels restore for non-folder modes
  if (!isFolder) {
    document.querySelector('.slider-group .slider-label span:first-child').textContent = '强度';
    document.querySelector('#radiusGroup .slider-label span:first-child').textContent = '半径';
  }

  // Reset folder drag offset when entering folder mode
  if (isFolder) {
    S.photoOffX = 0; S.photoOffY = 0;
    S.folderDragging = false;
  }

  // Restore saved params for new mode
  const p = modeParams[m];
  S.strength = p.strength;
  S.radius = p.radius;
  S.cx = p.cx;
  S.cy = p.cy;
  document.getElementById('strengthSlider').value = Math.round(S.strength * 100);
  document.getElementById('strengthVal').textContent = Math.round(S.strength * 100) + '%';
  document.getElementById('radiusSlider').value = Math.round(S.radius * 100);
  document.getElementById('radiusVal').textContent = Math.round(S.radius * 100) + '%';

  // Reset peel state after all mode params are restored so the cover is closed by default.
  if (isPeel) {
    resetPeelCover();
    requestAnimationFrame(resetPeelCover);
  }
}

function switchFrame(fc) {
  S.frameColor = fc;
  document.querySelectorAll('.frame-btn').forEach(b => b.classList.toggle('active', +b.dataset.fc === fc));
}

function resetParams() {
  S.cx = 0.5; S.cy = 0.5;
  const defaults = { 0: { s: 0.3, r: 0.5 }, 1: { s: 0.8, r: 0.42 }, 2: { s: 0.5, r: 0.35 }, 3: { s: 0.6, r: 0.3 }, 4: { s: 0.5, r: 0.3 }, 5: { s: 0.6, r: 0.12 }, 6: { s: 0.6, r: 0.3 } };
  S.strength = defaults[S.mode].s;
  S.radius = defaults[S.mode].r;
  if (S.mode === 4) {
    resetPeelCover();
  }
  if (S.mode === 5) {
    S.photoOffX = 0; S.photoOffY = 0;
  }
  document.getElementById('strengthSlider').value = Math.round(S.strength * 100);
  document.getElementById('strengthVal').textContent = Math.round(S.strength * 100) + '%';
  document.getElementById('radiusSlider').value = Math.round(S.radius * 100);
  document.getElementById('radiusVal').textContent = Math.round(S.radius * 100) + '%';
  showToast('已重置');
}

// ============================================================
//  Image Picker
// ============================================================
let imagePickerOpening = false;

function pickImage(type) {
  if (imagePickerOpening) return;
  imagePickerOpening = true;
  window.setTimeout(() => { imagePickerOpening = false; }, 600);

  const inp = document.getElementById('fileInput');
  if (type === 'camera') {
    inp.setAttribute('capture', 'environment');
  } else {
    inp.removeAttribute('capture');
  }
  inp.click();
}

document.getElementById('fileInput').addEventListener('change', function() {
  imagePickerOpening = false;
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      loadImageToGL(img);
      // Hide empty state placeholder
      const empty = document.getElementById('canvasEmpty');
      if (empty) empty.classList.add('hidden');
      resetParams();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
  this.value = '';
});

// backToWelcome removed — single page app

// ============================================================
//  Export
// ============================================================
function saveImage() {
  if (!S.imgLoaded) return;
  // Render at current state (preserveDrawingBuffer is on)
  canvas.toBlob(blob => {
    if (!blob) { showToast('导出失败'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'fisheye_' + Date.now() + '.png';
    a.click();
    URL.revokeObjectURL(url);
    showToast('已保存', true);
  }, 'image/png');
}

function shareImage() {
  if (!S.imgLoaded) return;
  canvas.toBlob(async blob => {
    if (!blob) return;
    if (navigator.share) {
      const file = new File([blob], 'fisheye.png', { type: 'image/png' });
      try {
        await navigator.share({ files: [file], title: 'FishEye Cam' });
      } catch(e) { /* user cancelled */ }
    } else {
      saveImage(); // fallback
    }
  }, 'image/png');
}

// ============================================================
//  Toast
// ============================================================
function showToast(msg, success) {
  const t = document.getElementById('toast');
  t.innerHTML = (success ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></svg>' : '') + msg;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(() => t.classList.remove('show'), 2000);
}

// ============================================================
//  Init
// ============================================================
function initFolderColors() {
  const row = document.getElementById('folderColorBtns');
  FOLDER_COLORS.forEach((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'frame-btn' + (i === 0 ? ' active' : '');
    btn.dataset.fci = i;
    btn.style.padding = '0';
    btn.style.width = '34px';
    btn.style.height = '34px';
    btn.style.borderRadius = '50%';
    btn.style.minWidth = '34px';
    const swatch = document.createElement('span');
    swatch.style.display = 'block';
    swatch.style.width = '20px';
    swatch.style.height = '20px';
    swatch.style.borderRadius = '50%';
    swatch.style.background = `rgb(${Math.round(c.body[0]*255)},${Math.round(c.body[1]*255)},${Math.round(c.body[2]*255)})`;
    btn.appendChild(swatch);
    btn.onclick = () => {
      S.folderColorIdx = i;
      row.querySelectorAll('.frame-btn').forEach((b,j) => b.classList.toggle('active', j === i));
    };
    row.appendChild(btn);
  });
}

// ============================================================
//  Mode Wheel — Film Strip with 3D cylinder perspective
// ============================================================
function initModeWheel() {
  const wrap = document.getElementById('modeWheelWrap');
  const wheel = document.getElementById('modeWheel');
  const items = [...wheel.querySelectorAll('.mode-item')];
  const modes = items.map(it => Number(it.dataset.mode));
  const ITEM_W = 80; // logical width per item
  const COUNT = items.length;

  // Set item widths
  items.forEach(it => { it.style.width = ITEM_W + 'px'; });

  // Padding so first/last can center
  let wrapW = wrap.clientWidth;
  const padSide = Math.floor(wrapW / 2 - ITEM_W / 2);
  wheel.style.paddingLeft = padSide + 'px';
  wheel.style.paddingRight = padSide + 'px';

  function indexForMode(mode) {
    const idx = modes.indexOf(mode);
    return idx >= 0 ? idx : 0;
  }

  let currentIdx = indexForMode(S.mode);
  let offset = -currentIdx * ITEM_W;
  let startX = 0, startOffset = 0, isDragging = false;
  let velocity = 0, lastX = 0, lastTime = 0;
  let animId = null;

  function applyTransform() {
    wheel.style.transform = `translateX(${offset}px)`;
    // 3D cylinder perspective per item
    const centerPos = -offset / ITEM_W; // fractional index at center
    items.forEach((it, i) => {
      const dist = i - centerPos; // signed distance from center
      const absDist = Math.abs(dist);

      // Rotate around Y axis — items curve away like a film reel
      const rotY = dist * 18; // degrees per item distance
      const clampedRotY = Math.max(-65, Math.min(65, rotY));

      // Depth: push farther items back
      const tz = -absDist * 8;

      // Scale: slight shrink for distant items
      const sc = Math.max(0.7, 1.0 - absDist * 0.06);

      // Opacity: fade out distant items
      const alpha = Math.max(0.12, 1.0 - absDist * 0.35);

      it.style.transform = `rotateY(${clampedRotY}deg) translateZ(${tz}px) scale(${sc})`;
      it.style.opacity = alpha;
      it.classList.toggle('active', Math.round(centerPos) === i);
    });
  }

  function snapTo(idx, animated) {
    idx = Math.max(0, Math.min(COUNT - 1, idx));
    const target = -idx * ITEM_W;
    if (!animated) {
      offset = target;
      applyTransform();
      if (idx !== currentIdx) { currentIdx = idx; switchMode(modes[idx]); }
      return;
    }
    cancelAnimationFrame(animId);
    function tick() {
      const diff = target - offset;
      if (Math.abs(diff) < 0.5) {
        offset = target;
        applyTransform();
        if (idx !== currentIdx) { currentIdx = idx; switchMode(modes[idx]); }
        return;
      }
      offset += diff * 0.18;
      applyTransform();
      animId = requestAnimationFrame(tick);
    }
    tick();
  }

  function onStart(x) {
    cancelAnimationFrame(animId);
    isDragging = true;
    startX = x;
    startOffset = offset;
    lastX = x;
    lastTime = Date.now();
    velocity = 0;
  }

  function onMove(x) {
    if (!isDragging) return;
    const dx = x - startX;
    offset = startOffset + dx;
    // Clamp with rubber band
    const minOff = -(COUNT - 1) * ITEM_W;
    if (offset > 0) offset *= 0.3;
    else if (offset < minOff) offset = minOff + (offset - minOff) * 0.3;
    applyTransform();

    const now = Date.now();
    const dt = now - lastTime;
    if (dt > 0) {
      velocity = (x - lastX) / dt * 16;
    }
    lastX = x;
    lastTime = now;
  }

  function onEnd() {
    if (!isDragging) return;
    isDragging = false;
    let predicted = offset + velocity * 5;
    let idx = Math.round(-predicted / ITEM_W);
    idx = Math.max(0, Math.min(COUNT - 1, idx));
    snapTo(idx, true);
  }

  // Touch events
  wrap.addEventListener('touchstart', e => {
    e.stopPropagation();
    if (e.touches.length === 1) onStart(e.touches[0].clientX);
  }, { passive: true });
  wrap.addEventListener('touchmove', e => {
    e.stopPropagation();
    if (e.touches.length === 1) onMove(e.touches[0].clientX);
  }, { passive: true });
  wrap.addEventListener('touchend', e => { e.stopPropagation(); onEnd(); }, { passive: true });

  // Mouse events
  wrap.addEventListener('mousedown', e => { e.stopPropagation(); onStart(e.clientX); });
  window.addEventListener('mousemove', e => { if (isDragging) onMove(e.clientX); });
  window.addEventListener('mouseup', () => { if (isDragging) onEnd(); });

  // Click to select
  items.forEach((it, i) => {
    it.addEventListener('click', e => {
      e.stopPropagation();
      if (Math.abs(velocity) < 0.5) snapTo(i, true);
    });
  });

  // Handle resize
  window.addEventListener('resize', () => {
    wrapW = wrap.clientWidth;
    const ps = Math.floor(wrapW / 2 - ITEM_W / 2);
    wheel.style.paddingLeft = ps + 'px';
    wheel.style.paddingRight = ps + 'px';
    snapTo(currentIdx, false);
  });

  // Initial position
  snapTo(currentIdx, false);

  // Expose for programmatic use
  window._modeWheelSnapTo = snapTo;
}

window.addEventListener('DOMContentLoaded', () => {
  initGL();
  resizeCanvas();
  setupTouch();
  initFolderColors();
  initModeWheel();
  render();
});
window.addEventListener('resize', () => { if (gl) resizeCanvas(); });
